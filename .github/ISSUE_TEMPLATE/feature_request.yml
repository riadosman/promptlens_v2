name: Feature request
description: Propose a scoped product or connector capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user problem independently of a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
    validations:
      required: true
