<style>
        body {
            background-color: #09090B;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            color: #e4e1e6;
        }
        .auth-card {
            background-color: #18181B;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .input-field {
            background-color: #111113;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .input-field:focus {
            border-color: #7C3AED;
            outline: none;
        }

<body class="min-h-screen flex flex-col items-center justify-center p-md">
<!-- Auth Container -->
<div class="auth-card w-full max-w-[420px] rounded-xl p-xl flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="flex items-center gap-sm text-primary mb-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="font-display text-headline-md tracking-tighter">PROMPTLENS</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Authenticate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your secure environment.</p>
</div>
<!-- Secure Indicator -->
<div class="flex items-center justify-center gap-xs bg-surface-container-lowest rounded-DEFAULT py-sm px-md border border-outline-variant/30">
<span class="material-symbols-outlined text-[14px] text-tertiary-fixed-dim">lock</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">End-to-End Encrypted Session</span>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<input class="input-field w-full rounded-DEFAULT px-md py-sm font-label-md text-label-md text-on-surface placeholder:text-outline/50 transition-colors" id="email" placeholder="user@domain.com" type="email">
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<input class="input-field w-full rounded-DEFAULT px-md py-sm font-label-md text-label-md text-on-surface placeholder:text-outline/50 transition-colors" id="password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-primary-container hover:bg-inverse-primary text-on-primary-container font-headline-md text-body-md py-sm rounded-DEFAULT transition-colors mt-sm" type="button">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Or continue with</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- SSO -->
<div class="flex gap-md">
<button class="flex-1 flex justify-center items-center gap-sm py-sm border border-outline-variant/30 rounded-DEFAULT hover:bg-surface-variant/20 transition-colors group" type="button">
<svg class="w-4 h-4 fill-on-surface group-hover:fill-primary transition-colors" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
<span class="font-label-md text-label-md text-on-surface">GitHub</span>
</button>
<button class="flex-1 flex justify-center items-center gap-sm py-sm border border-outline-variant/30 rounded-DEFAULT hover:bg-surface-variant/20 transition-colors group" type="button">
<svg class="w-4 h-4 fill-on-surface group-hover:fill-primary transition-colors" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
</div>
<div class="text-center mt-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Need an account?</span>
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed ml-xs transition-colors" href="#">Request Access</a>
</div>
</div>
