name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @promptlens/connector-sdk build
      - run: pnpm --filter @promptlens/connector-claude-code build
      - run: pnpm --filter @promptlens/connector-codex build
      - name: Pack connector artifacts
        run: |
          mkdir -p artifacts
          pnpm --filter @promptlens/connector-sdk pack --pack-destination ../../artifacts
          pnpm --filter @promptlens/connector-claude-code pack --pack-destination ../../artifacts
          pnpm --filter @promptlens/connector-codex pack --pack-destination ../../artifacts
          sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign connector archives
        run: |
          for archive in artifacts/*.tgz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "${archive}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: promptlens-${{ github.ref_name }}-connectors
          path: artifacts/

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  source-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sbom
      - uses: actions/upload-artifact@v7
        with:
          name: promptlens-${{ github.ref_name }}-spdx
          path: artifacts/promptlens.spdx.json
